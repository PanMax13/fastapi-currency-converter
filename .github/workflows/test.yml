name: Test and Push

on:
  push:
    branches:
      - test 

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.13

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: PYTHONPATH=. pytest -v

  push_code:
    name: Push Code to Main
    runs-on: ubuntu-latest
    needs: test  

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure Git Identity
        run: |
          git config --global user.email "panezhamax@gmail.com"
          git config --global user.name "PanMax13"

      - name: Configure Git Identity
        run: |
          git config --global user.email "panezhamax@gmail.com"
          git config --global user.name "PanMax13"

      - name: Merge test into main and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_SECRET_KEY }}
        run: |
          git fetch origin main
          git checkout main
          if git merge origin/test --no-ff --allow-unrelated-histories -m "Auto push to main after successful tests"; then
            echo "Succesfully pushed to main"
            git push -u origin main
          else
            echo "Error"
          fi
